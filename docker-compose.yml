version: '3.8'

services:
  promptshield-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: promptshield_api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=promptshield
      - DEFAULT_ADMIN_KEY=ps_live_admin_secret_key_9921
      - RATE_LIMIT_PER_MINUTE=60
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    container_name: promptshield_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
